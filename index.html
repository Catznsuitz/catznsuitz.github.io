
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My beautiful site</title>

  <style>
    body {
      background-image: url('jpg(7).jpg');
      background-repeat: repeat;
      background-size: 250px 250px;
      margin: 0;
    }

    .grey-box {
      background-color: rgba(128, 101, 79, 0.7);
      width: 700px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 30px;
      box-sizing: border-box;
      color: white;
      border-radius: 10px;
    }
    
    .spotify-player {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 9999;

    border-radius: 12px;
    overflow: hidden;

    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
}
  </style>
</head>

<body>

  <div class="music-container">

    <div class="music-text">
        currently listening to ♡
    </div>

    <div class="spotify-player">
        <iframe
            src="https://open.spotify.com/embed/track/0FZSug11WYcGKlgv1HPF69?utm_source=generator&theme=0&si=e73c67082b364c82"
            width="300"
            height="152"
            frameborder="0"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>
    </div>

</div>
</div>

  <div class="grey-box">
    <p>Put your text here!</p>
  </div>

</body>
</html>
