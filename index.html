<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tiled Background</title>
  <style>
    body {
      /* Replace 'pattern.png' with your image path or URL */
      background-image: url('pattern.png');
      
      /* 'repeat' is the default behavior, tiling both horizontally and vertically */
      background-repeat: repeat; 
    }
  </style>
</head>
<body>
  <h1>Welcome to my website</h1>
</body>
</html>
